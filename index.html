:root {

  --accent: #D4A574;

}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--canvas);
  color: var(--text);
  line-height: 1.6;
  padding: 24px 16px;
  min-height: 100vh;
}
.container { max-width: 720px; margin: 0 auto; }
header { text-align: center; margin-bottom: 32px; }
h1 {
  font-family: 'Newsreader', serif;
  font-size: clamp(24px, 5vw, 32px);
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text-muted);
}
.tabs {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-bottom: 28px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.tab {
  font-size: 15px;
  font-weight: 400;
  color: var(--text-muted);
  cursor: pointer;
  padding: 8px 4px;
  transition: all 0.15s ease;
  border: none;
  background: none;
  position: relative;
}
.tab:hover { color: var(--text); }
.tab.active {
  font-weight: 600;
  color: var(--text);
}
.tab.active::after {
  content: '';
  position: absolute;
  bottom: -13px;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--accent);
}
.list { display: none; }
.list.active { display: block; }
.item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 12px;
  transition: all 0.2s ease;
}
.item:hover {
  background: var(--card-hover);
  border-color: var(--accent);
  transform: translateY(-1px);
}
.item-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 8px;
}
.lang-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-top: 7px;
  flex-shrink: 0;
}
.lang-dot.Python { background: #3572A5; }
.lang-dot.JavaScript { background: #F1E05A; }
.lang-dot.TypeScript { background: #3178C6; }
.lang-dot.Rust { background: #DEA584; }
.lang-dot.Go { background: #00ADD8; }
.lang-dot.HTML { background: #E34C26; }
.lang-dot.Shell { background: #89E051; }
.lang-dot.Swift { background: #FA7343; }
.lang-dot.Haskell { background: #5E5086; }
.lang-dot.C { background: #555555; }
.lang-dot.NA { background: #999; }
.item-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  text-decoration: none;
  flex: 1;
}
.item-name:hover { color: var(--accent); }
.item-stars {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--star);
  font-weight: 500;
  white-space: nowrap;
}
.item-desc {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 10px;
  line-height: 1.5;
}
.item-meta {
  display: flex;
  gap: 16px;
  font-size: 12px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
}
.item-meta span { display: flex; align-items: center; gap: 4px; }
.empty {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-muted);
  font-size: 14px;
}
@media (max-width: 480px) {
  body { padding: 16px 12px; }
  .tabs { gap: 20px; }
  .tab { font-size: 14px; }
  .item { padding: 14px 16px; }
}
</style>
</head>

const rangeLabels = { daily: '今日', weekly: '本周', monthly: '本月' };

function formatStars(n) {
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return n.toString();
}

function renderList(range) {
  const items = data
    .filter(d => d.timeRange === range)
    .sort((a, b) => b.starsInRange - a.starsInRange);
  
  const container = document.getElementById(range);
  if (items.length === 0) {
    container.innerHTML = '<div class="empty">No data for this time range</div>';
    return;
  }
  
  const label = rangeLabels[range];
  container.innerHTML = items.map(item => `
    <article class="item">
      <div class="item-header">
        <span class="lang-dot ${item.lang.replace(/\+/, 'plus')}" title="${item.lang}"></span>
        <a class="item-name" href="${item.url}" target="_blank" rel="noopener">${item.owner}/${item.name}</a>
        <span class="item-stars">★ ${formatStars(item.starsInRange)} ${label}</span>
      </div>
      <p class="item-desc">${item.desc}</p>
      <div class="item-meta">
        <span>语言: ${item.lang}</span>
        <span>★ ${formatStars(item.stars)} 总星数</span>
        <span>⑂ ${formatStars(item.forks)} Forks</span>
      </div>
    </article>
  `).join('');
}

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.list').forEach(l => l.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.range).classList.add('active');
  });
});

// Initial render
['daily', 'weekly', 'monthly'].forEach(renderList);
